[project]
name = "bioinformatics-prompts"
version = "0.1.0"
description = "Generate and use bioinformatics-specific prompts with Anthropic's Claude AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.1.0",
    "click>=8.4.2",
]

[project.optional-dependencies]
# Template routing only. dspy pulls in litellm and, through it, the OpenAI SDK,
# which no consumer of this Claude-focused library should pay for unless they
# actually route.
routing = ["dspy>=3.3.0"]

[project.scripts]
bioinformatics-prompts = "bioinformatics_prompts.cli:cli"

[dependency-groups]
# Split so the core-only CI job can install pytest *without* dspy:
#   uv sync --no-default-groups --group test
# A bare `uv sync` still gets dev, so the contributor loop is unchanged. dspy is
# here as well as in the extra because uv has no `default-extras` setting, and
# without it tests/test_router.py would be unimportable after a plain sync.
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]
dev = [
    { include-group = "test" },
    "dspy>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source = ["src/bioinformatics_prompts"]
omit = [
    "src/bioinformatics_prompts/prompt/templates/ai.py",
    "src/bioinformatics_prompts/prompt/templates/bioinformatics_tools.py",
    "src/bioinformatics_prompts/prompt/templates/blockchain_bioinformatics.py",
    "src/bioinformatics_prompts/prompt/templates/data_standardization.py",
    "src/bioinformatics_prompts/prompt/templates/epigenomics.py",
    "src/bioinformatics_prompts/prompt/templates/genomics.py",
    "src/bioinformatics_prompts/prompt/templates/gwas.py",
    "src/bioinformatics_prompts/prompt/templates/metagenomics.py",
    "src/bioinformatics_prompts/prompt/templates/ngs_sequencing.py",
    "src/bioinformatics_prompts/prompt/templates/precision_medicine.py",
    "src/bioinformatics_prompts/prompt/templates/sequence_analysis.py",
    "src/bioinformatics_prompts/prompt/templates/single_cell.py",
    "src/bioinformatics_prompts/prompt/templates/synthetic_biology.py",
    "src/bioinformatics_prompts/prompt/templates/workflow_automation.py",
    "*/tests/*",
    "*/.venv/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
