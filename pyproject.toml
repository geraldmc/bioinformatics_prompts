[project]
name = "bioinformatics-prompts"
version = "0.1.0"
description = "Generate and use bioinformatics-specific prompts with Anthropic's Claude AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "geraldmc" }]
# No "License :: OSI Approved :: MIT License" classifier: per the packaging
# guide, classifier-based license declarations serve only PyPI search and are
# superseded by the PEP 639 `license` field above. Carrying both invites
# tooling conflicts.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.1.0",
    "click>=8.4.2",
]

[project.optional-dependencies]
# Template routing only. dspy pulls in litellm and, through it, the OpenAI SDK,
# which no consumer of this Claude-focused library should pay for unless they
# actually route.
routing = ["dspy>=3.3.0"]

[project.urls]
Homepage = "https://github.com/geraldmc/bioinformatics_prompts"
Repository = "https://github.com/geraldmc/bioinformatics_prompts"
Issues = "https://github.com/geraldmc/bioinformatics_prompts/issues"

[project.scripts]
bioinformatics-prompts = "bioinformatics_prompts.cli:cli"

[dependency-groups]
# Split so the core-only CI job can install pytest *without* dspy:
#   uv sync --no-default-groups --group test
# A bare `uv sync` still gets dev, so the contributor loop is unchanged. dspy is
# here as well as in the extra because uv has no `default-extras` setting, and
# without it tests/test_router.py would be unimportable after a plain sync.
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    # For tests/test_typing_contract.py. In `test` rather than `dev` so the
    # contract is checked wherever pytest runs, including the core-only job.
    "mypy>=1.18",
]
dev = [
    { include-group = "test" },
    "dspy>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source = ["src/bioinformatics_prompts"]
omit = [
    # The 14 template data modules, by pattern rather than by name: the
    # hand-maintained list silently went stale whenever a template was added.
    # Safe because this directory holds only template content -- the data model
    # moved out in #21, and test_public_api.py guards that it stays that way.
    "*/prompt/templates/*.py",
    "*/tests/*",
    "*/.venv/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
